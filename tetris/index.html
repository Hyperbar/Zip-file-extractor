<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tetris</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="header">
        <h1 class="title">Tetris</h1>
        <div class="controls">
          <button id="newGameBtn" class="btn">Nouvelle partie</button>
          <button id="pauseBtn" class="btn">Pause</button>
        </div>
      </header>

      <main class="main">
        <section class="sidebar">
          <div class="panel">
            <div class="stat"><span class="label">Score</span><span id="score" class="value">0</span></div>
            <div class="stat"><span class="label">Lignes</span><span id="lines" class="value">0</span></div>
            <div class="stat"><span class="label">Niveau</span><span id="level" class="value">1</span></div>
          </div>
          <div class="help">
            <div class="help-title">Contrôles</div>
            <ul>
              <li>←/→: déplacer</li>
              <li>↑: rotation horaire</li>
              <li>Z: rotation antihoraire</li>
              <li>↓: descente rapide</li>
              <li>Espace: chute directe</li>
              <li>P: pause</li>
            </ul>
          </div>
        </section>

        <section class="stage">
          <canvas id="gameCanvas" width="300" height="600"></canvas>
        </section>
      </main>

      <footer class="footer">Fait avec ❤️ — Amusez-vous bien !</footer>
    </div>

    <script defer src="./main.js"></script>
  </body>
</html>
